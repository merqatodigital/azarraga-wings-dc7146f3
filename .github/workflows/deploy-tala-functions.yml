name: Deploy TALA Runtime

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-tala-functions.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: tktqpnhsysiblodyjrrw
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Require Supabase deployment credential
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: |
          echo "::error::SUPABASE_ACCESS_TOKEN is required to deploy the TALA Edge Functions."
          exit 1
      - name: Deploy authenticated TALA functions
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          supabase functions deploy tala-agent --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy tala-document-extract --project-ref "$SUPABASE_PROJECT_REF"
